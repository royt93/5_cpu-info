[versions]
agp = "8.7.3"
kotlin = "1.9.25"
ksp = "1.9.25-1.0.20"
coroutines = "1.9.0"
hilt = "2.51.1"
composeBom = "2024.06.00"
composeCompiler = "1.5.15"
lifecycle = "2.8.7"
navigation = "2.8.7"
glide = "4.16.0"
dependencyUpdates = "0.47.0"
junit = "4.13.2"
mockk = "1.13.13"
archCoreTesting = "2.2.0"
androidxTestExtJunit = "1.2.1"
espresso = "3.6.1"
uiautomator = "2.3.0"
testOrchestrator = "1.5.1"
testServices = "1.5.0"
# AndroidX
coreKtx = "1.15.0"
activityCompose = "1.10.0"
fragmentKtx = "1.8.6"
appcompat = "1.7.0"
preferenceKtx = "1.2.1"
swiperefreshlayout = "1.1.0"
constraintlayout = "2.2.0"
viewpager2 = "1.1.0"
datastorePreferences = "1.1.2"
collectionsImmutable = "0.3.5"
kotlinStdlibJdk7 = "1.9.25"
# Google
materialAndroid = "1.12.0"
gson = "2.11.0"
playReview = "2.0.2"
# Others
timber = "5.0.1"
relinker = "1.4.5"
coilCompose = "2.7.0"
admobWrapper = "1.1.5"
lottie = "6.6.6"
mpAndroidChart = "v3.1.0"

[libraries]
# Kotlin / Coroutines
kotlin-stdlib-jdk7 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk7", version.ref = "kotlinStdlibJdk7" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preferenceKtx" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-common-java8 = { module = "androidx.lifecycle:lifecycle-common-java8", version.ref = "lifecycle" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }

# Compose (BOM-managed, no version)
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material = { module = "androidx.compose.material:material" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-animation = { module = "androidx.compose.animation:animation" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# Google
google-material = { module = "com.google.android.material:material", version.ref = "materialAndroid" }
google-gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
google-play-review = { module = "com.google.android.play:review", version.ref = "playReview" }
google-play-review-ktx = { module = "com.google.android.play:review-ktx", version.ref = "playReview" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

# Glide
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-ksp = { module = "com.github.bumptech.glide:ksp", version.ref = "glide" }

# Misc
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
relinker = { module = "com.getkeepsafe.relinker:relinker", version.ref = "relinker" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }
admob-wrapper = { module = "com.github.royt93:AdmobApplovinWrapper", version.ref = "admobWrapper" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
mp-android-chart = { module = "com.github.PhilJay:MPAndroidChart", version.ref = "mpAndroidChart" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-arch-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "archCoreTesting" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "espresso" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-orchestrator = { module = "androidx.test:orchestrator", version.ref = "testOrchestrator" }
androidx-test-services = { module = "androidx.test.services:test-services", version.ref = "testServices" }

# Build script classpath (referenced via buildscript block)
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
hilt-gradle-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
dependency-updates = { id = "com.github.ben-manes.versions", version.ref = "dependencyUpdates" }
